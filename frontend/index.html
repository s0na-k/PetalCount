<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PetalCount</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    </head>

    <body>

        <div class="container">

            <h1>PetalCount</h1>
            <p class="subtitle">Build your flower order and get an instant price</p>

            <div class="arrangement-section">
                <p class="section-label">Arrangement type</p>
                <div class="type-buttons">
                    <button class="type-btn active" data-type="loose">Loose stem</button>
                    <button class="type-btn" data-type="wrapped">Wrapped</button>
                    <button class="type-btn" data-type="vase">Vase</button>
                </div>
            </div>

        

            <div class="form-section">
                <div class="col-headers">
                    <span>Item Name</span>
                    <span>Qty</span>
                    <span>Unit Price</span>
                    <span></span>
                </div>
                <div id="item-rows">
                </div>
                <button id="add-item-btn">+ Add Item</button>
            </div>

            <button id="calculate-btn">Calculate</button>

            <div id="results" class="results-section hidden">
                <div id="results-breakdown"></div>
                <div class="results-total">
                    <span>Total</span>
                    <span id="total-price">$0.00</span>
                </div>
                <div class="save-order-row">
                    <input
                        type="text"
                        id="order-name-input"
                        maxlength="50"
                        placeholder="Name this order (e.g. Bridal Bouquet)"
                    />
                    <button id="save-order-btn">Save order</button>
                </div>
                <div class="char-counter-row">
                    <span id="name-char-counter">0/50</span>
                </div>
            </div>
            

            <div id="saved-orders" class="saved-orders-section">
                <p class="section-label">Saved orders</p>
                <div id="saved-orders-list"></div>
            </div>

        </div>

        <div id="order-modal" class="modal-overlay hidden">
            <div class="modal-box">
                <button id="close-btn">×</button>
                <div class="modal-header">
                    <h2 id="modal-name"></h2>
                    <span id="modal-type"></span>
                </div>
                
                <table>
                    <thead>
                        <tr>
                            <th>Item Name</th>
                            <th>Qty</th>
                            <th>Unit Price</th>
                        </tr>
                    </thead>
                    <tbody id="modal-items">
                    </tbody>
                </table>
                <p id="modal-total"></p>
                <div class="modal-actions">
                    <button id="modal-load-btn" class="modal-btn">Load</button>
                    <button id="modal-edit-btn" class="modal-btn">Edit</button>
                    <button id="modal-delete-btn" class="modal-btn">Delete</button>
                </div>
                
            </div>
        </div>


        <script src="app.js"></script>
    </body>

</html>
